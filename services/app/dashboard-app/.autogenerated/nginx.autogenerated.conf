#
# ANY MANUAL CHANGES MADE TO THIS FILE WILL BE WIPED ON THE NEXT 'tilt up'.
# TO MODIFY THIS CONFIGURATION:
# 1. Edit the source generator in: .tilt/topologies/
# 2. Or update service.json
#
# Generation Source: Nginx.frontend()
# Service: dashboard-app
# Type: Output: .autogenerated/nginx.autogenerated.conf
###############################################################################

    # Docker DNS resolver
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Auto-discovered backend routing map (referer-based context routing)
    map $http_referer $api_backend {
        default http://dashboard-app:3200;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/json
            application/javascript
            application/xml+rss
            application/atom+xml
            image/svg+xml;

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        location ~* \.(js|css)$ {
            expires 2m;
            add_header Cache-Control "public, max-age=120, must-revalidate";
            add_header Last-Modified $date_gmt;
            add_header ETag off;
            if_modified_since off;
        }

        location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location /api {
            proxy_pass $api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Referer $http_referer;
        }

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
