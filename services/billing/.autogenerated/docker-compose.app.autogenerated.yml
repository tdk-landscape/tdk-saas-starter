    restart: unless-stopped
    build:
      context: ../../../../.
      dockerfile: services/billing/billing-api/.autogenerated/Dockerfile.app.autogenerated

    env_file:
      - ../../../services/billing/billing-api/.autogenerated/.env.backend.autogenerated
    environment:
      - RESOURCE_NAME=billing-api
      - INFISICAL_SECRET_PATH=/services/billing-api
      - INFISICAL_TOKEN=${INFISICAL_TOKEN:-}
      - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID:-}
      - INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET:-}
      - INFISICAL_API_URL=${INFISICAL_API_URL:-http://infisical:8080}
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID:-}
      - INFISICAL_ENVIRONMENT=${INFISICAL_ENVIRONMENT:-dev}
      - INFISICAL_ALLOW_FALLBACK=${INFISICAL_ALLOW_FALLBACK:-true}
      - RESOURCE_NAME=billing
      - PORT=4210
      - INSTANCE_ID=0
      - NATS_QUEUE_GROUP=billing_backend_svc
      - TILT_DATABASE_URL=postgresql://tdk_saas_starter:${DB_PASSWORD}@tdk_saas_starter_postgres:5432/tdk_saas_starter_billing?schema=public
      - TILT_NATS_URL=nats://tdk_saas_starter_nats:4222
      - NODE_ENV=development
      - DATABASE_URL=postgresql://tdk_saas_starter:${DB_PASSWORD}@tdk_saas_starter_postgres:5432/tdk_saas_starter_billing?schema=public
      - AUTH_MODE=identity-service
      - IDENTITY_RESOURCE_URL=${IDENTITY_RESOURCE_URL:-None}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.billing-api.rule=Host(`billing.backend.tdk_saas_starter.local`)"
      - "traefik.http.routers.billing-api.entrypoints=web"
      - "traefik.http.routers.billing-api.service=billing-api"

      - "traefik.http.services.billing-api.loadbalancer.server.port=4210"
      - "traefik.http.services.billing-api.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.billing-api.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.billing-api.loadbalancer.healthcheck.timeout=5s"
      - "traefik.http.services.billing-api.loadbalancer.healthcheck.followredirects=false"
      - "traefik.docker.network=tdk_saas_starter_traefik-public"

      - "traefik.http.routers.billing-api-project.rule=Host(`api.tdk-saas-starter.localhost`) && PathPrefix(`/api/billing`)"
      - "traefik.http.routers.billing-api-project.entrypoints=web"
      - "traefik.http.routers.billing-api-project.service=billing-api"
      - "traefik.http.routers.billing-api-project.middlewares=billing-api-strip-prefix-project"
      - "traefik.http.middlewares.billing-api-strip-prefix-project.stripprefix.prefixes=/api/billing"
      - "traefik.http.routers.billing-api-project.priority=112"

      - "traefik.http.routers.billing-api-management.rule=Host(`api.tdk-saas-starter.localhost`) && PathPrefix(`/api/billing-management`)"
      - "traefik.http.routers.billing-api-management.entrypoints=web"
      - "traefik.http.routers.billing-api-management.service=billing-api"
      - "traefik.http.routers.billing-api-management.middlewares=billing-api-strip-prefix-management"
      - "traefik.http.middlewares.billing-api-strip-prefix-management.stripprefix.prefixes=/api/billing-management"
      - "traefik.http.routers.billing-api-management.priority=123"

      # Redirect middleware for URL restructuring: old path -> new path
      - "traefik.http.middlewares.billing-api-redirect.redirectregex.regex=^`/billing-management/api/v1/(.*)`"
      - "traefik.http.middlewares.billing-api-redirect.redirectregex.replacement=`/api/billing/$$1`"
      - "traefik.http.middlewares.billing-api-redirect.redirectregex.permanent=true"

    networks:
      - tdk_saas_starter_traefik-public
      - tdk_saas_starter_backend
      - tdk_saas_starter_database
      - tdk_saas_starter_infisical-network
    healthcheck:
      test: ["CMD", "curl", "-f", "--max-time", "5", "http://localhost:4210/health"]
      interval: 10s
      timeout: 5s
      retries: 6
