    build:
      context: ../../../../.
      dockerfile: services/billing/checkout-app/.autogenerated/Dockerfile.app.autogenerated
      target: production
    <<: *frontend-memory-limit
    env_file:
      - ../../../services/billing/checkout-app/.autogenerated/.env.frontend.autogenerated
    environment:
        - VITE_APP_ENV=development
    labels:
        - "traefik.enable=true"
        - 'traefik.http.routers.checkout-app.rule=Host(`checkout-app.localhost`) || (Host(`app.tdk-saas-starter.localhost`) && PathPrefix(`/checkout-app`)) || (Host(`localhost`) && PathPrefix(`/checkout-app`))'
        - "traefik.http.routers.checkout-app.entrypoints=web,websecure"
        - "traefik.http.routers.checkout-app.priority=113"
        - "traefik.http.routers.checkout-app.middlewares=checkout-app-strip-prefix"
        - "traefik.http.middlewares.checkout-app-strip-prefix.stripprefix.prefixes=/checkout-app"
        - "traefik.http.services.checkout-app.loadbalancer.server.port=3210"
        - "traefik.docker.network=tdk_saas_starter_traefik-public"
    networks:
        - tdk_saas_starter_traefik-public
        - tdk_saas_starter_backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3210"]
      interval: 10s
      timeout: 5s
      retries: 3
      # STORY 4 FIX: 30s grace period to prevent 504 errors on startup
      start_period: 30s

